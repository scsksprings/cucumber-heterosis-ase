name: Validate research release
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  statistical-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - run: python -m pip install -r requirements-tested.txt
      - run: python -m pytest tests -q
      - run: python scripts/validate_release.py
      - run: python pipeline/scripts/reproduce_enrichment.py
      - run: python pipeline/scripts/reproduce_qpcr.py
  manuscript-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-figures.txt
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.1'
      - run: python -m pip install -r requirements-figures.txt
      - run: bash run_all.sh
